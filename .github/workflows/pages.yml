name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'products/**'
      - 'categories/**'
      - 'images/**/*.yaml'
      - 'tools/src/api/static-site-builder.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: tools
        run: npm ci --ignore-scripts

      - name: Generate static site
        run: npx tsx tools/src/api/static-site-builder.ts
        env:
          ND_ROOT: .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
